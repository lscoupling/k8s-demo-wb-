# Service 範例
# Service 為一組 Pod 提供穩定的網路訪問入口

---
# ClusterIP Service（預設類型）
# 只能在叢集內部訪問
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
  - name: http
    port: 80        # Service 對外暴露的端口
    targetPort: 80  # Pod 的端口
    protocol: TCP
  
  # Session Affinity：同一客戶端的請求會被路由到同一個 Pod
  # sessionAffinity: ClientIP

---
# NodePort Service
# 可以從叢集外部透過 <NodeIP>:<NodePort> 訪問
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080  # 可選：指定 NodePort（範圍 30000-32767）
    protocol: TCP

---
# LoadBalancer Service
# 會在雲端環境中創建一個外部負載均衡器
# 在本地環境（Minikube/Kind）可能需要額外配置
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  labels:
    app: nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---
# Headless Service
# 不分配 ClusterIP，用於直接訪問每個 Pod
# 常用於 StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
  labels:
    app: nginx
spec:
  clusterIP: None  # Headless Service 的關鍵配置
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80

---
# ExternalName Service
# 將服務映射到外部 DNS 名稱
# 用於訪問叢集外部的服務
apiVersion: v1
kind: Service
metadata:
  name: external-service
spec:
  type: ExternalName
  externalName: www.example.com
  ports:
  - port: 80

---
# Service with Multiple Ports
# 一個 Service 可以暴露多個端口
apiVersion: v1
kind: Service
metadata:
  name: multi-port-service
spec:
  type: ClusterIP
  selector:
    app: webapp
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: https
    port: 443
    targetPort: 8443
  - name: metrics
    port: 9090
    targetPort: 9090
