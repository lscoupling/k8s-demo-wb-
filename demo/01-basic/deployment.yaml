# Deployment 範例
# Deployment 是 Kubernetes 中最常用的控制器
# 用於管理無狀態應用的部署、擴展和更新

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  # 副本數量：定義要運行多少個 Pod
  replicas: 3
  
  # 選擇器：定義此 Deployment 管理哪些 Pod
  selector:
    matchLabels:
      app: nginx
  
  # 更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 更新時最多可以多出幾個 Pod
      maxUnavailable: 1  # 更新時最多可以有幾個 Pod 不可用
  
  # Pod 模板
  template:
    metadata:
      labels:
        app: nginx
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
          name: http
        
        # 資源限制
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        
        # 環境變數
        env:
        - name: ENVIRONMENT
          value: "demo"
        - name: VERSION
          value: "1.21"

---
# 進階 Deployment 範例
# 展示更多實用配置

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  
  # 歷史版本保留數量（用於回滾）
  revisionHistoryLimit: 5
  
  # 進度期限（秒）
  progressDeadlineSeconds: 600
  
  template:
    metadata:
      labels:
        app: webapp
        tier: frontend
    spec:
      # Pod 反親和性：避免多個副本運行在同一節點
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - webapp
              topologyKey: kubernetes.io/hostname
      
      containers:
      - name: webapp
        image: nginx:alpine
        ports:
        - containerPort: 80
        
        # 生命週期鉤子
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo 'Container started' > /tmp/started"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "nginx -s quit; while killall -0 nginx; do sleep 1; done"]
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
