# Secret 範例
# 用於儲存敏感資料（密碼、API 金鑰、憑證等）
# Secret 中的資料會被 base64 編碼（注意：不是加密）

---
# 基本 Secret - Opaque 類型（通用類型）
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: demo
type: Opaque
data:
  # 注意：這些值必須是 base64 編碼
  # 在終端機執行：echo -n 'mypassword' | base64
  DB_PASSWORD: bXlwYXNzd29yZA==           # mypassword
  API_KEY: c3VwZXJzZWNyZXRrZXkxMjM=       # supersecretkey123
  ADMIN_PASSWORD: YWRtaW4xMjM0NTY=        # admin123456

# 或使用 stringData（自動 base64 編碼）
stringData:
  DB_USERNAME: "admin"
  DB_HOST: "postgres.example.com"
  API_SECRET: "my-super-secret-value"

---
# Docker Registry Secret
# 用於從私有 Docker Registry 拉取映像
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6InVzZXIiLCJwYXNzd29yZCI6InBhc3MiLCJlbWFpbCI6InVzZXJAZXhhbXBsZS5jb20iLCJhdXRoIjoiZFhObGNqcHdZWE56In19fQ==

# 或使用命令創建：
# kubectl create secret docker-registry docker-registry-secret \
#   --docker-server=registry.example.com \
#   --docker-username=user \
#   --docker-password=pass \
#   --docker-email=user@example.com

---
# TLS Secret
# 用於儲存 TLS 憑證和私鑰
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
type: kubernetes.io/tls
data:
  # 這些值應該是實際的 TLS 憑證和私鑰（base64 編碼）
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...

# 或使用命令創建：
# kubectl create secret tls tls-secret \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key

---
# SSH 認證 Secret
apiVersion: v1
kind: Secret
metadata:
  name: ssh-secret
type: kubernetes.io/ssh-auth
data:
  # SSH 私鑰（base64 編碼）
  ssh-privatekey: LS0tLS1CRUdJTiBPUEVOU1NIIFBSSVZBVEUgS0VZLS0tLS0...

---
# Basic Auth Secret
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-secret
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: admin123

---
# 使用 Secret 的 Pod - 環境變數方式
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-secret-env
  labels:
    app: secret-demo
spec:
  containers:
  - name: app
    image: busybox
    command:
    - /bin/sh
    - -c
    - |
      echo "==================================="
      echo "Sensitive Configuration"
      echo "==================================="
      echo "DB Username: $DB_USERNAME"
      echo "DB Host: $DB_HOST"
      # 注意：不要印出實際密碼！
      echo "DB Password: [REDACTED]"
      echo "API Key: [REDACTED]"
      echo "==================================="
      sleep 3600
    
    # 從 Secret 注入環境變數
    env:
    # 單個環境變數
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
    
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: API_KEY
    
    # 從 Secret 導入所有環境變數
    envFrom:
    - secretRef:
        name: app-secret

---
# 使用 Secret 的 Pod - 檔案掛載方式
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-secret-volume
  labels:
    app: secret-demo
spec:
  containers:
  - name: app
    image: busybox
    command:
    - /bin/sh
    - -c
    - |
      echo "Secret files:"
      ls -la /etc/secrets/
      echo ""
      echo "DB Username:"
      cat /etc/secrets/DB_USERNAME
      echo ""
      echo "API Secret exists: $(test -f /etc/secrets/API_SECRET && echo 'yes' || echo 'no')"
      sleep 3600
    
    # 將 Secret 掛載為檔案
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true  # 建議以唯讀方式掛載
  
  volumes:
  - name: secret-volume
    secret:
      secretName: app-secret
      # 可選：只掛載特定的 key
      # items:
      # - key: DB_PASSWORD
      #   path: db-password
      # 設定檔案權限
      defaultMode: 0400

---
# 使用 Docker Registry Secret 拉取私有映像
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-private-image
spec:
  # 指定 imagePullSecrets
  imagePullSecrets:
  - name: docker-registry-secret
  
  containers:
  - name: app
    image: registry.example.com/myapp:latest
    ports:
    - containerPort: 8080

---
# Deployment 使用 Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-webapp
  labels:
    app: secure-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-webapp
  template:
    metadata:
      labels:
        app: secure-webapp
    spec:
      containers:
      - name: webapp
        image: nginx:alpine
        ports:
        - containerPort: 80
        
        # 環境變數
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: API_KEY
        
        # 掛載 Secret 為檔案
        volumeMounts:
        - name: secrets
          mountPath: /etc/secrets
          readOnly: true
      
      volumes:
      - name: secrets
        secret:
          secretName: app-secret

---
# 實戰範例：資料庫連接配置
# ConfigMap 存放非敏感資料
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
data:
  DB_HOST: "postgres.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "myapp_db"
  DB_SSL_MODE: "require"
  DB_MAX_CONNECTIONS: "20"

---
# Secret 存放敏感資料
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
type: Opaque
stringData:
  DB_USERNAME: "app_user"
  DB_PASSWORD: "SuperSecure!Password123"
  DB_ADMIN_PASSWORD: "AdminPassword456!"

---
# 使用兩者的 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-client
  template:
    metadata:
      labels:
        app: db-client
    spec:
      containers:
      - name: app
        image: postgres:14-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "Connecting to database..."
          echo "Host: $DB_HOST:$DB_PORT"
          echo "Database: $DB_NAME"
          echo "Username: $DB_USERNAME"
          echo "SSL Mode: $DB_SSL_MODE"
          # 實際應用中，這裡會連接資料庫
          sleep 3600
        
        # 從 ConfigMap 載入環境變數
        envFrom:
        - configMapRef:
            name: database-config
        
        # 從 Secret 載入敏感環境變數
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD

---
# 注意事項 ConfigMap
# ConfigMap 用於非敏感資料：
# - 應用程式配置
# - 環境變數
# - 配置檔案
# - 命令行參數

# Secret 用於敏感資料：
# - 密碼
# - API 金鑰
# - OAuth Token
# - SSH 金鑰
# - TLS 憑證

# 安全建議：
# 1. 啟用 Kubernetes 的加密靜態資料功能
# 2. 使用 RBAC 限制對 Secret 的訪問
# 3. 使用外部秘密管理工具（如 AWS Secrets Manager、HashiCorp Vault）
# 4. 定期輪換憑證和密碼
# 5. 不要將 Secret 提交到版本控制系統
