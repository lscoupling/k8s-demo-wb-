# Liveness Probe（存活探針）範例
# 用於檢測容器是否存活
# 如果探測失敗，kubelet 會重啟容器

---
# HTTP GET 方式的 Liveness Probe
apiVersion: v1
kind: Pod
metadata:
  name: liveness-http
  labels:
    app: liveness-demo
    probe-type: http
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
    
    livenessProbe:
      httpGet:
        path: /             # 健康檢查的路徑
        port: 80            # 端口
        scheme: HTTP        # 協議（HTTP 或 HTTPS）
      initialDelaySeconds: 10  # 容器啟動後等待幾秒開始探測
      periodSeconds: 5         # 每隔幾秒探測一次
      timeoutSeconds: 3        # 探測超時時間
      successThreshold: 1      # 連續成功幾次才算成功
      failureThreshold: 3      # 連續失敗幾次才重啟容器

---
# TCP Socket 方式的 Liveness Probe
apiVersion: v1
kind: Pod
metadata:
  name: liveness-tcp
  labels:
    app: liveness-demo
    probe-type: tcp
spec:
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
    
    livenessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3

---
# Exec 命令方式的 Liveness Probe
apiVersion: v1
kind: Pod
metadata:
  name: liveness-exec
  labels:
    app: liveness-demo
    probe-type: exec
spec:
  containers:
  - name: busybox
    image: busybox
    args:
    - /bin/sh
    - -c
    - touch /tmp/healthy; sleep 30; rm -rf /tmp/healthy; sleep 600
    
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 1
      failureThreshold: 3

---
# 實戰範例：模擬應用程式崩潰
# 此 Pod 會在 60 秒後刪除健康檔案，觸發 Liveness 探測失敗
apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo-crash
  labels:
    app: liveness-demo
    scenario: crash-simulation
spec:
  containers:
  - name: app
    image: nginx:1.21
    ports:
    - containerPort: 80
    
    # 模擬應用程式在 60 秒後崩潰
    lifecycle:
      postStart:
        exec:
          command:
          - /bin/sh
          - -c
          - |
            sleep 60
            rm -f /usr/share/nginx/html/index.html
    
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3
    
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "64Mi"
        cpu: "100m"
